<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Running Coach Pro</title>
    <style>
        :root {
            --primary-color: #ff6b00;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dddddd;
            --success-color: #28a745;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 25px;
        }
        .section {
            margin-bottom: 25px;
            padding: 20px;
            background: #fafbfc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }
        h2 {
            font-size: 1.2rem;
            color: #444;
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 5px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #e56000;
        }
        .btn-secondary {
            background-color: #4b6584;
            margin-top: 10px;
        }
        .btn-secondary:hover {
            background-color: #384b63;
        }
        .result-box {
            margin-top: 30px;
            padding: 20px;
            background: #fff8f2;
            border-left: 5px solid var(--primary-color);
            border-radius: 4px;
            display: none;
        }
        .fueling-item {
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #ffd5b8;
        }
        .support-banner {
            text-align: center;
            margin-top: 30px;
            padding: 15px;
            background: #e8f8f0;
            border: 1px solid #d4ede2;
            border-radius: 8px;
        }
        .support-banner a {
            color: var(--success-color);
            font-weight: bold;
            text-decoration: none;
        }
        .support-banner a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Running Coach Pro</h1>
    
    <!-- Configurazione Atleta & Ritmi -->
    <div class="section">
        <h2>Parametri Atleta & Ritmi</h2>
        <div class="form-group">
            <label for="paceRMA">Ritmo Riferimento (es. 5:00 min/km):</label>
            <input type="text" id="paceRMA" value="5:00">
        </div>
        <div class="form-group">
            <label for="shoeModel">Modello Scarpe in Uso:</label>
            <input type="text" id="shoeModel" value="Mizuno Wave Neo Vista 2">
        </div>
    </div>

    <!-- Generatore Allenamento e Nutrizione -->
    <div class="section">
        <h2>Generatore Piano & Strategia Integrazione</h2>
        <div class="form-group">
            <label for="workoutType">Tipo di Sessione / Gara:</label>
            <select id="workoutType">
                <option value="allenamento">Allenamento Lungo</option>
                <option value="maratona">Gara Maratona</option>
                <option value="ultra">Gara / Lunghissimo Ultra</option>
            </select>
        </div>

        <div class="form-group">
            <label for="distance">Distanza (km):</label>
            <input type="number" id="distance" value="16" min="1" max="150">
        </div>

        <div class="form-group">
            <label for="method">Metodo di Pacing:</label>
            <select id="method">
                <option value="standard">Costante</option>
                <option value="runwalk">Metodo 9+1 (9 min run / 1 min walk)</option>
            </select>
        </div>

        <button onclick="generatePlan()">Genera Piano e Strategia</button>
        <button class="btn-secondary" onclick="logCompletedRace()">Oggi ho fatto una Gara</button>
    </div>

    <!-- Risultati -->
    <div id="resultBox" class="result-box">
        <h3>Piano di Allenamento & Strategia di Integrazione</h3>
        <div id="planOutput"></div>
        <hr style="border: 0; border-top: 1px solid #ffd5b8; margin: 15px 0;">
        <div id="fuelingContent"></div>
    </div>

    <!-- Sezione Supporto Volontario Stripe -->
    <div class="support-banner">
        <p>Ti piace Running Coach Pro? Sostieni lo sviluppo e il mantenimento dell'app con un contributo volontario una tantum di 3€.</p>
        <!-- Inserisci qui sotto il link di pagamento Stripe quando attivo -->
        <a href="https://buy.stripe.com/TUO_LINK_STRIPE" target="_blank">☕ Supporta lo sviluppo (3,00 €)</a>
    </div>
</div>

<script>
function generatePlan() {
    const distance = parseFloat(document.getElementById('distance').value);
    const workoutType = document.getElementById('workoutType').value;
    const method = document.getElementById('method').value;
    const shoe = document.getElementById('shoeModel').value;
    const pace = document.getElementById('paceRMA').value;
    
    const resultBox = document.getElementById('resultBox');
    const planOutput = document.getElementById('planOutput');
    const fuelingContent = document.getElementById('fuelingContent');

    // 1. Output Piano Base
    let planHtml = `<p><strong>Distanza:</strong> ${distance} km | <strong>Ritmo Base:</strong> ${pace} min/km | <strong>Scarpe:</strong> ${shoe}</p>`;
    if (method === 'runwalk') {
        planHtml += `<p><em>Gestione con metodo 9+1 applicata (9 minuti di corsa continua seguiti da 1 minuto di camminata rigenerante).</em></p>`;
    }
    planOutput.innerHTML = planHtml;

    // 2. Output Strategia di Integrazione (Soglia 14km + Ultra/Maratona)
    let fuelingHtml = `<h4>Strategia di Integrazione & Nutrizione</h4>`;

    if (distance <= 14) {
        fuelingHtml += `<p><strong>Distanza (${distance} km):</strong> Inferiore o uguale a 14 km. Non è necessaria un'integrazione complessa; sono sufficienti acqua o sali minerali a seconda della temperatura.</p>`;
    } else {
        fuelingHtml += `<p><strong>Distanza (${distance} km):</strong> Superiore a 14 km. Attivazione della strategia di fueling avanzata.</p>`;
        fuelingHtml += `<h5>Tabella di marcia consigliata:</h5>`;

        if (workoutType === 'maratona') {
            fuelingHtml += `<div class="fueling-item"><strong>Ogni 35-40 min:</strong> Gel energetico a rapido assorbimento + acqua.</div>`;
            fuelingHtml += `<div class="fueling-item"><strong>Fase finale (dopo il 70% della gara):</strong> Eventuale gel con caffeina per il boost finale.</div>`;
        } else if (workoutType === 'ultra') {
            fuelingHtml += `<div class="fueling-item"><strong>Prima metà (Fase Dolce / Energia Rapida):</strong> Gel leggeri, crostatina alla marmellata o frutta disidratata. Lo stomaco è fresco, priorità ai carboidrati semplici.</div>`;
            fuelingHtml += `<div class="fueling-item"><strong>Seconda metà / Subentra la fatica (Fase Salata & Solidi):</strong> Inserire cibi salati (gallette di riso salate, piccoli panini con bresaola o fesa, parmigiano) per ripristinare il sodio, prevenire i crampi e spezzare la nausea da dolce.</div>`;
            fuelingHtml += `<div class="fueling-item"><strong>Frequenza consigliata:</strong> Alternare un piccolo spunto solido o un gel ogni 45-60 minuti, accompagnato sempre da piccoli sorsi d'acqua.</div>`;
        } else {
            // Allenamento lungo standard
            fuelingHtml += `<div class="fueling-item"><strong>Ogni 45 min circa:</strong> Alternare un piccolo snack dolce (es. pezzo di barretta o frutta) a un'opzione salata leggera per abituare lo stomaco in vista delle gare lunghe.</div>`;
        }
    }

    fuelingContent.innerHTML = fuelingHtml;
    resultBox.style.display = 'block';
}

function logCompletedRace() {
    alert("Funzione 'Oggi ho fatto una Gara' registrata con successo!");
}
</script>

</body>
</html>
